  <path d="M256 235 L256 345" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- Bookmark Ribbon -->
  <path d="M256 345 L256 380 L266 370 L276 380 L276 345 Z" fill="url(#gold)"/>

  <!-- Graduation Cap -->
  <!-- Top Diamond -->
