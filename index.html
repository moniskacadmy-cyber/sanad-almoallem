  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تذكيراتي - تطبيق التذكيرات والتقويم</title>
    <meta name="description" content="تطبيق التذكيرات المتقدم وتنظيم المواعيد باللغة العربية مع دعم التقويم والعمل بدون إنترنت." />
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN Script -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Dev Server WebSocket & Preamble Handler -->
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          function isViteHmr(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') return true;
            if (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) return true;
            if (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/client') || url.includes('vite-hmr'))) return true;
            return false;
          }

          try {
            window.WebSocket = new Proxy(OrigWebSocket, {
              construct(target, args, newTarget) {
                const [url, protocols] = args;
                if (isViteHmr(url, protocols)) {
                  const mockWs = new EventTarget();
                  mockWs.url = url;
                  mockWs.protocols = protocols;
                  mockWs.readyState = 1;
                  mockWs.bufferedAmount = 0;
                  mockWs.extensions = '';
                  mockWs.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
                  mockWs.binaryType = 'blob';
                  mockWs.send = function() {};
                  mockWs.close = function() {
                    mockWs.readyState = 3;
                    const ev = new Event('close');
                    mockWs.dispatchEvent(ev);
                    if (typeof mockWs.onclose === 'function') mockWs.onclose(ev);
                  };
                  setTimeout(() => {
                    if (mockWs.readyState === 1) {
                      const ev = new Event('open');
                      mockWs.dispatchEvent(ev);
                      if (typeof mockWs.onopen === 'function') mockWs.onopen(ev);
                    }
                  }, 5);
                  return mockWs;
                }
                return Reflect.construct(target, args, newTarget);
              }
            });
          } catch (_) {}
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
