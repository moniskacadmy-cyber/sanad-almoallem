    <script id="hmr-suppressor">
      (function() {
        if (typeof window === 'undefined') return;
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(t) { return t; }; };
        window.__vite_plugin_react_preamble_installed__ = true;

        function shouldSuppress(msg) {
          if (!msg) return false;
          var str = String(msg);
          return str.indexOf('[vite]') !== -1 ||
                 str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('SendBeforeConnectError') !== -1 ||
                 str.indexOf('server connection lost') !== -1;
        }

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(m) {
          var orig = console[m];
          if (typeof orig === 'function') {
            console[m] = function() {
              for (var i = 0; i < arguments.length; i++) {
                var a = arguments[i];
                var s = typeof a === 'object' && a !== null ? (a.message || a.stack || String(a)) : String(a);
                if (shouldSuppress(s)) return;
              }
              return Function.prototype.apply.call(orig, console, arguments);
            };
          }
        });

        window.addEventListener('error', function(e) {
          var m = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (shouldSuppress(m)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var r = (e && (e.reason && (e.reason.message || e.reason.stack || String(e.reason)))) || '';
          if (shouldSuppress(r)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        if (window.WebSocket) {
          var OrigWS = window.WebSocket;
          var ProxyWS = new Proxy(OrigWS, {
            construct: function(target, args, newTarget) {
              var url = args[0];
              var proto = args[1];
              var isVite = (proto === 'vite-hmr' || proto === 'vite-ping') ||
                           (Array.isArray(proto) && (proto.indexOf('vite-hmr') !== -1 || proto.indexOf('vite-ping') !== -1)) ||
                           (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1 || url.indexOf('token=') !== -1 || url.indexOf(':5173') !== -1));
              if (isVite) {
                var ws = new EventTarget();
                ws.CONNECTING = 0;
                ws.OPEN = 1;
                ws.CLOSING = 2;
                ws.CLOSED = 3;
                ws.readyState = 1;
                ws.url = url;
                ws.bufferedAmount = 0;
                ws.extensions = '';
                ws.protocol = typeof proto === 'string' ? proto : 'vite-hmr';
                ws.binaryType = 'blob';
                ws.send = function() {};
                ws.close = function() {
                  ws.readyState = 3;
                  var ev = new Event('close');
                  ev.wasClean = true;
                  ws.dispatchEvent(ev);
                  if (typeof ws.onclose === 'function') {
                    try { ws.onclose(ev); } catch(_) {}
                  }
                };

                var origAdd = ws.addEventListener.bind(ws);
                ws.addEventListener = function(type, listener, options) {
                  origAdd(type, listener, options);
                  if (type === 'open' && ws.readyState === 1) {
                    setTimeout(function() {
                      try {
                        if (typeof listener === 'function') listener(new Event('open'));
                        else if (listener && typeof listener.handleEvent === 'function') listener.handleEvent(new Event('open'));
                      } catch(_) {}
                    }, 0);
                  }
                };

                setTimeout(function() {
                  if (ws.readyState === 1) {
                    var ev = new Event('open');
                    ws.dispatchEvent(ev);
                    if (typeof ws.onopen === 'function') {
                      try { ws.onopen(ev); } catch(_) {}
                    }
                  }
                }, 0);
                return ws;
              }
              return Reflect.construct(target, args, newTarget);
            }
          });

          ProxyWS.CONNECTING = 0;
          ProxyWS.OPEN = 1;
          ProxyWS.CLOSING = 2;
          ProxyWS.CLOSED = 3;
          window.WebSocket = ProxyWS;
        }
      })();
    </script>
