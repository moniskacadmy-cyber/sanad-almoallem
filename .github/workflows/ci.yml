name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start Firebase emulators
        run: |
          npx --yes firebase-tools emulators:start --only auth,firestore --project demo-sanad > /tmp/firebase-emulator.log 2>&1 &
          echo $! > /tmp/firebase-emulator.pid
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1 && curl -sf http://127.0.0.1:9099/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null
          curl -sf http://127.0.0.1:9099/ > /dev/null

      - name: Run Firebase Rules and Emulator E2E tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_PROJECT_ID: demo-sanad
        run: |
          node --import tsx --test tests/firestoreRules.emulator.integration.ts
          node --import tsx --test tests/emulatorE2EWorkflow.test.ts

      - name: Run Post-Build Smoke Test
        run: npx tsx scripts/smoke-test.ts

      - name: Print emulator logs on failure
        if: failure()
        run: cat /tmp/firebase-emulator.log || true
